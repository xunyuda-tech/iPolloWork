<!doctype html>
<!-- Inner document for the cross-origin iframe fullscreen checks. The whole
     surface is one button so any click inside the frame requests fullscreen;
     the outcome is reported to the embedding page via postMessage. -->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>studio preview</title>
  <style>
    html, body { margin: 0; height: 100%; }
    #inner-root { height: 100%; background: #e2e8f0; font: 14px system-ui, sans-serif; }
    #go { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #38bdf8; font-size: 16px; }
    #go:fullscreen { background: #0ea5e9; }
  </style>
</head>
<body>
  <div id="inner-root">
    <button id="go" type="button">request fullscreen</button>
  </div>
  <script>
    const frame = new URLSearchParams(location.search).get("frame");
    const report = (ok, name) => window.parent.postMessage({ source: "fullscreen-inner", frame, ok, name: name ?? null }, "*");
    document.getElementById("go").addEventListener("click", () => {
      document.getElementById("inner-root").requestFullscreen()
        .then(() => report(true))
        .catch((error) => report(false, error?.name ?? String(error)));
    });
  </script>
</body>
</html>
